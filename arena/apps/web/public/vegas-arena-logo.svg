<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">VEGAS АРЕНА</title>
<desc id="desc">Золотая эмблема VEGAS АРЕНА с короной, красной пиковой мастью и декоративными линиями на прозрачном фоне.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c1"/><stop offset=".25" stop-color="#e9c77e"/><stop offset=".62" stop-color="#bd8a42"/><stop offset="1" stop-color="#f0d38f"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a91d29"/><stop offset=".5" stop-color="#5a101b"/><stop offset="1" stop-color="#210a10"/></linearGradient>
  <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e9"/><stop offset="1" stop-color="#d9c9ad"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
