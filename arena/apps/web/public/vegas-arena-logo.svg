  <text x="450" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="48" letter-spacing="8" fill="url(#ivory)">АРЕНА</text>
  <path d="M295 319 Q370 325 425 319 L450 331 L475 319 Q530 325 605 319" fill="none" stroke="url(#gold)" stroke-width="2"/>
