<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Крокодил — рисуем</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17212b);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #8b9aa8);
    --accent: var(--tg-theme-button-color, #3390ec);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --panel: var(--tg-theme-secondary-bg-color, #232e3c);
    box-sizing: border-box;
  }

  *, *::before, *::after { box-sizing: inherit; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 0) 12px env(safe-area-inset-bottom, 0);
  }

  .word {
    text-align: center;
    padding: 12px 8px 8px;
  }

  .word .label {
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--hint);
  }

  .word .value {
    font-size: 26px;
    font-weight: 700;
    margin-top: 2px;
    word-break: break-word;
  }

  .word .level { font-size: 12px; color: var(--hint); }

  #board {
    flex: 1 1 auto;
    min-height: 0;
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;
    position: relative;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .tools {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 2px;
    overflow-x: auto;
  }

  .swatch {
    width: 30px; height: 30px;
    border-radius: 50%;
    flex: 0 0 auto;
    border: 2px solid transparent;
  }

  .swatch.active { border-color: var(--accent); transform: scale(1.12); }

  .size {
    width: 34px; height: 30px;
    border-radius: 8px;
    flex: 0 0 auto;
    background: var(--panel);
    display: grid;
    place-items: center;
  }

  .size.active { outline: 2px solid var(--accent); }

  .size i { display: block; border-radius: 50%; background: var(--text); }

  .actions { display: flex; gap: 8px; padding-bottom: 10px; }

  button {
    font: inherit;
    border: 0;
    border-radius: 10px;
    padding: 12px 14px;
    background: var(--panel);
    color: var(--text);
  }

  button.primary {
    flex: 1 1 auto;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
  }

  button:disabled { opacity: .5; }

  .note {
    text-align: center;
    font-size: 13px;
    color: var(--hint);
    padding: 24px 16px;
  }
</style>
</head>
<body>

<div class="word" id="wordBox">
  <div class="label">твоё слово</div>
  <div class="value" id="word">…</div>
  <div class="level" id="level"></div>
</div>

<div id="board"><canvas id="canvas"></canvas></div>

<div class="tools" id="tools"></div>

<div class="actions">
  <button id="undo">↩︎</button>
  <button id="clear">Стереть</button>
  <button id="send" class="primary">Отправить в чат</button>
</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var initData = (tg && tg.initData) || "";

  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var strokes = [];
  var current = null;
  var color = "#111111";
  var size = 4;

  var COLORS = ["#111111", "#e53935", "#fb8c00", "#fdd835",
                "#43a047", "#1e88e5", "#8e24aa", "#ffffff"];
  var SIZES = [3, 6, 12, 22];

  function fit() {
    var rect = canvas.parentNode.getBoundingClientRect();
    var ratio = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * ratio);
    canvas.height = Math.round(rect.height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    redraw();
  }

  function redraw() {
    var rect = canvas.parentNode.getBoundingClientRect();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, rect.width, rect.height);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    strokes.forEach(function (stroke) {
      if (stroke.points.length < 2) {
        ctx.beginPath();
        ctx.fillStyle = stroke.color;
        ctx.arc(stroke.points[0].x, stroke.points[0].y, stroke.size / 2, 0, 6.3);
        ctx.fill();
        return;
      }
      ctx.beginPath();
      ctx.strokeStyle = stroke.color;
      ctx.lineWidth = stroke.size;
      ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
      for (var i = 1; i < stroke.points.length; i++) {
        ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
      }
      ctx.stroke();
    });
  }

  function pos(event) {
    var rect = canvas.getBoundingClientRect();
    var touch = event.touches ? event.touches[0] : event;
    return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
  }

  function down(event) {
    event.preventDefault();
    current = { color: color, size: size, points: [pos(event)] };
    strokes.push(current);
    redraw();
  }

  function move(event) {
    if (!current) return;
    event.preventDefault();
    current.points.push(pos(event));
    redraw();
  }

  function up() { current = null; }

  canvas.addEventListener("pointerdown", down);
  canvas.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  canvas.addEventListener("touchstart", down, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", up);

  // Панель инструментов
  var tools = document.getElementById("tools");

  COLORS.forEach(function (value, index) {
    var el = document.createElement("div");
    el.className = "swatch" + (index === 0 ? " active" : "");
    el.style.background = value;
    if (value === "#ffffff") el.style.boxShadow = "inset 0 0 0 1px #ccc";
    el.onclick = function () {
      color = value;
      [].forEach.call(tools.querySelectorAll(".swatch"), function (s) {
        s.classList.remove("active");
      });
      el.classList.add("active");
    };
    tools.appendChild(el);
  });

  SIZES.forEach(function (value, index) {
    var el = document.createElement("div");
    el.className = "size" + (index === 1 ? " active" : "");
    var dot = document.createElement("i");
    dot.style.width = Math.min(value, 20) + "px";
    dot.style.height = Math.min(value, 20) + "px";
    el.appendChild(dot);
    el.onclick = function () {
      size = value;
      [].forEach.call(tools.querySelectorAll(".size"), function (s) {
        s.classList.remove("active");
      });
      el.classList.add("active");
    };
    tools.appendChild(el);
  });
  size = SIZES[1];

  document.getElementById("undo").onclick = function () {
    strokes.pop();
    redraw();
  };

  document.getElementById("clear").onclick = function () {
    strokes = [];
    redraw();
  };

  // Слово для ведущего
  fetch("/api/round", { headers: { "X-Init-Data": initData } })
    .then(function (response) {
      if (!response.ok) throw new Error(response.status);
      return response.json();
    })
    .then(function (data) {
      document.getElementById("word").textContent = (data.word || "").toUpperCase();
      document.getElementById("level").textContent = data.level || "";
    })
    .catch(function () {
      document.getElementById("wordBox").innerHTML =
        '<div class="note">Не удалось получить слово. Раунд мог закончиться — ' +
        'вернись в чат и начни заново.</div>';
    });

  var sendButton = document.getElementById("send");

  sendButton.onclick = function () {
    if (!strokes.length) {
      if (tg) tg.showAlert("Сначала нарисуй что-нибудь 🙂");
      return;
    }

    sendButton.disabled = true;
    sendButton.textContent = "Отправляю…";

    var image = canvas.toDataURL("image/png");

    fetch("/api/draw", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: initData, image: image })
    })
      .then(function (response) {
        if (!response.ok) throw new Error(response.status);
        return response.json();
      })
      .then(function () {
        if (tg) { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); tg.close(); }
      })
      .catch(function () {
        sendButton.disabled = false;
        sendButton.textContent = "Отправить в чат";
        if (tg) tg.showAlert("Не отправилось. Попробуй ещё раз.");
      });
  };

  window.addEventListener("resize", fit);
  fit();
})();
</script>
</body>
</html>
