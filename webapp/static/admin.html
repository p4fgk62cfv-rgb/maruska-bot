<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0911">
  <title>Маруська · Control Center</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/admin/css/theme.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="drawer" class="drawer"></aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Меню">☰</button>
        <div class="brand"><div class="brand-mark">💜</div><div><strong>Маруська</strong><span>Control Center</span></div></div>
        <div class="top-actions"><button class="icon-btn" id="notifyBtn">◉</button><button class="avatar" id="profileBtn">A</button></div>
      </header>
      <section class="workspace">
        <div class="context-row">
          <div><div class="eyebrow" id="pageEyebrow">COMMAND CENTER</div><h1 id="pageTitle">Главная</h1></div>
          <select id="chatSelect" class="select"></select>
        </div>
        <div id="content"></div>
      </section>
    </main>
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal"></div>
  <script type="module" src="/static/admin/js/app.js"></script>
</body>
</html>
